<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Mini Game Pack</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>Mini Game Pack</h1>

  <!-- ================= MAG DUEL ================= -->

  <section>
    <p id="mage1Info"></p>
<button id="p1Attack">P1 Attack</button>
<button id="p1Heal">P1 Heal</button>

<hr>

<p id="mage2Info"></p>
<button id="p2Attack">P2 Attack</button>
<button id="p2Heal">P2 Heal</button>

<div id="battleLog"></div>
  </section>

  <hr>

  <!-- ================= CLICK BATTLE ================= -->

  <section>
    <h2>2. Клік-Батл</h2>

    <p>Натискай A або L</p>

    <div id="battleArea">
      <div id="leftSide"></div>
      <div id="rightSide"></div>
    </div>

    <p id="battleText"></p>
  </section>

  <hr>

  <!-- ================= QUIZ ================= -->

  <section>
    <h2>3. Вікторина</h2>

    <p id="question"></p>

    <button class="answerBtn">HTML</button>
    <button class="answerBtn">CSS</button>
    <button class="answerBtn">TypeScript</button>

    <p id="quizResult"></p>
  </section>

  <script src="script.js"></script>
</body>
</html>
